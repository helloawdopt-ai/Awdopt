<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Filters</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500..900&amp;family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#2A1736}a:hover{color:#2A1736}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; background: #FFF7EC; color: #2A1736; font-family: 'Figtree', sans-serif; overflow: hidden">
  <div style="padding: 80px 16px 0">
    <div style="font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: 26px; line-height: 1.1">Dogs looking for a home</div>
  </div>
  <a href="Browse.dc.html" aria-label="Close filters" style="position: absolute; inset: 0; background: rgba(42, 23, 54, 0.55)"></a>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 730px; background: #FFF7EC; border-top: 2.5px solid #2A1736; border-radius: 28px 28px 0 0; display: flex; flex-direction: column">
    <div style="width: 44px; height: 5px; border-radius: 3px; background: #2A1736; opacity: 0.3; align-self: center; margin-top: 10px"></div>
    <div style="padding: 10px 16px 6px; display: flex; justify-content: space-between; align-items: center">
      <h2 style="margin: 0; font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: -0.03em">Filters</h2>
      <a href="Browse.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 14px; border: 2px solid #2A1736; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-sizing: border-box">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#2A1736" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </a>
    </div>

    <div style="flex-grow: 1; padding: 6px 16px 16px; display: flex; flex-direction: column; gap: 18px; overflow: hidden">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 13px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #6A5874">Location</span>
        <button style="height: 50px; border-radius: 16px; border: 2.5px solid #2A1736; background: #FFFFFF; padding: 0 14px; display: flex; align-items: center; justify-content: space-between; font-family: 'Figtree', sans-serif; font-size: 16px; font-weight: 700; color: #2A1736">
          <span style="display: flex; gap: 8px; align-items: center"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#2A1736" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg>Western suburbs</span>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#2A1736" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
        </button>
      </div>
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
        <div style="display: flex; flex-direction: column; gap: 8px">
          <span style="font-size: 13px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #6A5874">{{g.label}}</span>
          <div style="display: flex; flex-wrap: wrap; gap: 8px">
            <sc-for list="{{g.opts}}" as="o" hint-placeholder-count="3">
              <button onClick="{{o.toggle}}" aria-pressed="{{o.pressed}}" style="height: 44px; padding: 0 16px; border-radius: 999px; border: 2px solid #2A1736; background: {{o.bg}}; box-shadow: {{o.shadow}}; font-family: 'Figtree', sans-serif; font-size: 15px; font-weight: 700; color: #2A1736">{{o.label}}</button>
            </sc-for>
          </div>
        </div>
      </sc-for>
    </div>

    <div style="padding: 12px 16px 22px; border-top: 2.5px solid #2A1736; display: flex; gap: 10px">
      <button onClick="{{clear}}" style="height: 54px; padding: 0 20px; border-radius: 999px; border: 2.5px solid #2A1736; background: #FFFFFF; font-family: 'Figtree', sans-serif; font-size: 16px; font-weight: 800; color: #2A1736">Clear</button>
      <a href="Browse.dc.html" style="flex-grow: 1; height: 54px; border-radius: 999px; background: #FF6B2C; border: 2.5px solid #2A1736; box-shadow: 4px 4px 0 #2A1736; color: #2A1736; font-size: 17px; font-weight: 800; text-decoration: none; display: flex; align-items: center; justify-content: center; box-sizing: border-box">Show {{count}} dogs</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { on: { 'Medium': true, 'Indie': true } };
  }
  renderVals() {
    var self = this;
    var on = this.state.on;
    var defs = [
      { label: 'Age', opts: ['Puppy', 'Young', 'Adult', 'Senior'] },
      { label: 'Size', opts: ['Small', 'Medium', 'Large'] },
      { label: 'Breed / type', opts: ['Indie', 'Labrador mix', 'Beagle', 'Any breed'] },
      { label: 'Energy', opts: ['Chill', 'Balanced', 'Zoomies'] }
    ];
    var n = Object.keys(on).filter(function (k) { return on[k]; }).length;
    return {
      groups: defs.map(function (g) {
        return {
          label: g.label,
          opts: g.opts.map(function (o) {
            var sel = !!on[o];
            return {
              label: o,
              pressed: sel ? 'true' : 'false',
              bg: sel ? '#FFE066' : '#FFFFFF',
              shadow: sel ? '3px 3px 0 #2A1736' : 'none',
              toggle: function () { var next = Object.assign({}, self.state.on); next[o] = !next[o]; self.setState({ on: next }); }
            };
          })
        };
      }),
      count: Math.max(3, 24 - n * 7),
      clear: function () { self.setState({ on: {} }); }
    };
  }
}
</script>
</body>
</html>
