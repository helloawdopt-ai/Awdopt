<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Why Bruno fits</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500..900&amp;family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#2A1736}a:hover{color:#2A1736}
</style>
</helmet>
<div style="width: 390px; height: 1240px; box-sizing: border-box; position: relative; background: #FFF7EC; color: #2A1736; font-family: 'Figtree', sans-serif; overflow: hidden">
  <div style="padding: 12px 16px 0; display: flex; flex-direction: column; gap: 16px">
    <header style="height: 56px; display: flex; align-items: center; gap: 12px">
      <a href="Results.dc.html" aria-label="Back to matches" style="width: 44px; height: 44px; border-radius: 14px; border: 2px solid #2A1736; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-sizing: border-box">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#2A1736" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
      </a>
      <span style="font-size: 17px; font-weight: 800">You &amp; Bruno</span>
    </header>

    <div style="height: 210px; border-radius: 24px; border: 2.5px solid #2A1736; background: #FFE066; position: relative; display: flex; align-items: center; justify-content: center; color: #6A5874; font-size: 13px; font-weight: 700">
      [Bruno's photo]
      <div style="position: absolute; right: -6px; bottom: -22px; transform: rotate(5deg); background: #FF8FB8; border: 2.5px solid #2A1736; border-radius: 24px; box-shadow: 5px 5px 0 #2A1736; padding: 10px 16px; color: #2A1736; display: flex; flex-direction: column; align-items: flex-start">
        <span style="font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 14px">aww.</span>
        <span style="font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: 34px; line-height: 1; letter-spacing: -0.04em">92%</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px; margin-top: 4px">
      <div style="display: flex; gap: 8px; align-items: center"><h1 style="margin: 0; font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: 26px; letter-spacing: -0.04em">Great fit</h1><span style="font-size: 12px; font-weight: 800; background: #7FDDBE; border: 2px solid #2A1736; border-radius: 999px; padding: 3px 9px">85+</span></div>
      <span style="font-size: 14px; color: #6A5874">Based on all 8 categories. Nothing was guessed.</span>
    </div>

    <div style="background: #FFFFFF; border: 2.5px solid #2A1736; border-radius: 22px; padding: 14px 16px; display: flex; flex-direction: column; gap: 11px">
      <sc-for list="{{cats}}" as="c" hint-placeholder-count="8">
        <div style="display: flex; flex-direction: column; gap: 5px">
          <div style="display: flex; justify-content: space-between; font-size: 14px"><span style="font-weight: 700">{{c.name}} <span style="font-weight: 500; color: #6A5874">· {{c.w}}</span></span><span style="font-weight: 800; font-variant-numeric: tabular-nums">{{c.s}}</span></div>
          <div style="height: 10px; border-radius: 5px; border: 1.5px solid #2A1736; background: #FFF7EC; overflow: hidden"><div style="height: 100%; width: {{c.pct}}; background: {{c.fill}}"></div></div>
        </div>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 13px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #6A5874">Why this could work</span>
      <sc-for list="{{why}}" as="w" hint-placeholder-count="3">
        <div style="display: flex; gap: 10px; font-size: 15px; line-height: 1.45">
          <svg viewBox="0 0 24 24" width="22" height="22" style="flex-shrink: 0" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#7FDDBE" stroke="#2A1736" stroke-width="2"></circle><path d="M7.5 12.5l3 3 6-6.5" fill="none" stroke="#2A1736" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          <span>{{w}}</span>
        </div>
      </sc-for>
      <span style="font-size: 13px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #6A5874; margin-top: 6px">Things to consider</span>
      <sc-for list="{{consider}}" as="w" hint-placeholder-count="2">
        <div style="display: flex; gap: 10px; font-size: 15px; line-height: 1.45">
          <svg viewBox="0 0 24 24" width="22" height="22" style="flex-shrink: 0" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#FFE066" stroke="#2A1736" stroke-width="2"></circle><path d="M12 11v5M12 8h.01" fill="none" stroke="#2A1736" stroke-width="2.4" stroke-linecap="round"></path></svg>
          <span>{{w}}</span>
        </div>
      </sc-for>
    </div>

    <a href="Profile.dc.html" style="font-size: 15px; font-weight: 800">See Bruno's full profile</a>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 16px 22px; background: #FFF7EC; border-top: 2.5px solid #2A1736">
    <a href="Interested.dc.html" style="height: 54px; border-radius: 999px; background: #FF6B2C; border: 2.5px solid #2A1736; box-shadow: 4px 4px 0 #2A1736; color: #2A1736; font-size: 17px; font-weight: 800; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; box-sizing: border-box">
      <svg viewBox="-12 -12 24 22" width="20" height="18" aria-hidden="true"><path d="M0 7C-6 2-10-1-10-5C-10-8-7.5-10-5-10C-2.5-10-1-8.5 0-7C1-8.5 2.5-10 5-10C7.5-10 10-8 10-5C10-1 6 2 0 7Z" fill="#2A1736"></path></svg>
      I'm Interested
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1240}}'>
class Component extends DCLogic {
  renderVals() {
    var data = [
      ['Lifestyle & activity', '25%', 96], ['Living situation', '20%', 95], ['Time availability', '15%', 80], ['Children & other pets', '10%', 100],
      ['Dog experience', '10%', 85], ['Size preference', '10%', 95], ['Age preference', '5%', 90], ['Special-needs fit', '5%', 90]
    ];
    return {
      cats: data.map(function (d) { return { name: d[0], w: d[1], s: d[2], pct: d[2] + '%', fill: d[2] >= 90 ? '#7FDDBE' : '#FFE066' }; }),
      why: [
        'Good with other dogs, and you already have one.',
        'Your daily walks and weekend runs match his zoomies.',
        'Your 2BHK with a terrace suits a medium-sized Indie.'
      ],
      consider: [
        'He would be alone about 5 hours on weekdays; he is used to 4.',
        'He pulls on the leash, so a session with a trainer could help.'
      ]
    };
  }
}
</script>
</body>
</html>
