<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Find a Dog</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500..900&amp;family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#2A1736}a:hover{color:#2A1736}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; background: #FFF7EC; color: #2A1736; font-family: 'Figtree', sans-serif; overflow: hidden">
  <div style="padding: 12px 16px 0; display: flex; flex-direction: column; gap: 14px">
    <header style="height: 56px; display: flex; align-items: center; justify-content: space-between">
      <a href="Main.dc.html" aria-label="AWDOPT home" style="display: flex; align-items: baseline; text-decoration: none; color: #2A1736; font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: 22px; line-height: 1; letter-spacing: -0.04em"><span style="position: relative; background: #FF8FB8; border: 2px solid #2A1736; border-radius: 7px; padding: 1px 4px 3px; margin-right: 1px">aw<svg viewBox="0 0 26 22" style="position: absolute; left: 5px; top: calc(100% - 1px); width: 7px; height: 6px; overflow: visible" aria-hidden="true"><polygon points="0,-3 26,-3 4,20" fill="#FF8FB8"></polygon><polyline points="0,0 4,20 26,0" fill="none" stroke="#2A1736" stroke-width="6" stroke-linejoin="round"></polyline></svg></span>dopt</a>
      <button aria-label="Open menu" style="width: 44px; height: 44px; border-radius: 14px; border: 2px solid #2A1736; background: #FFE066; box-shadow: 3px 3px 0 #2A1736; display: flex; align-items: center; justify-content: center; padding: 0">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#2A1736" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"></path></svg>
      </button>
    </header>

    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: 26px; line-height: 1.1; letter-spacing: -0.035em">Dogs looking for a home</h1>
      <span style="font-size: 14px; color: #6A5874">9 dogs match your filters · Mumbai</span>
    </div>

    <div style="display: flex; gap: 8px; align-items: center; overflow: hidden">
      <a href="Filters.dc.html" style="flex-shrink: 0; height: 40px; padding: 0 14px; border-radius: 999px; background: #2A1736; color: #FFF7EC; font-size: 14px; font-weight: 700; text-decoration: none; display: flex; align-items: center; gap: 8px">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#FFF7EC" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"></path></svg>
        Filters · 2
      </a>
      <span style="flex-shrink: 0; height: 40px; padding: 0 12px; border-radius: 999px; background: #FFE066; border: 2px solid #2A1736; box-sizing: border-box; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 6px">Medium <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#2A1736" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></span>
      <span style="flex-shrink: 0; height: 40px; padding: 0 12px; border-radius: 999px; background: #FFE066; border: 2px solid #2A1736; box-sizing: border-box; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 6px">Indie <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#2A1736" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 18px">
      <sc-for list="{{dogs}}" as="d" hint-placeholder-count="2">
        <a href="Profile.dc.html" style="text-decoration: none; color: #2A1736; background: #FFFFFF; border: 2.5px solid #2A1736; border-radius: 24px; box-shadow: 5px 5px 0 #2A1736; overflow: hidden; display: flex; flex-direction: column">
          <div style="height: 210px; background: {{d.bg}}; border-bottom: 2.5px solid #2A1736; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: #6A5874">
            <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#6A5874" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="3"></rect><circle cx="12" cy="13" r="3.5"></circle><path d="M8 6l1.5-2h5L16 6"></path></svg>
            <span style="font-size: 12px; font-weight: 700">[{{d.name}}'s photo]</span>
            <span style="position: absolute; top: 12px; right: 12px; background: #FFFFFF; border: 2px solid #2A1736; border-radius: 999px; padding: 4px 10px; font-size: 13px; font-weight: 800">{{d.energy}}</span>
          </div>
          <div style="padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 4px">
            <div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: -0.03em">{{d.name}}</span><span style="font-size: 13px; font-weight: 700; color: #6A5874">{{d.loc}}</span></div>
            <div style="font-size: 14px; color: #6A5874">{{d.meta}}</div>
            <div style="font-size: 15px; line-height: 1.4; margin-top: 4px">{{d.line}}</div>
          </div>
        </a>
      </sc-for>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 16px 22px; background: #FFF7EC; border-top: 2.5px solid #2A1736">
    <a href="Quiz.dc.html" style="height: 54px; border-radius: 999px; background: #FF6B2C; border: 2.5px solid #2A1736; box-shadow: 4px 4px 0 #2A1736; color: #2A1736; font-size: 17px; font-weight: 800; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; box-sizing: border-box">
      <svg viewBox="0 0 40 40" width="18" height="18" aria-hidden="true"><path d="M20 0 C22 14 26 18 40 20 C26 22 22 26 20 40 C18 26 14 22 0 20 C14 18 18 14 20 0Z" fill="#2A1736"></path></svg>
      Get my match scores
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      dogs: [
        { name: 'Bruno', meta: 'Male · 2 yrs · Indie · Medium', loc: 'Andheri W', energy: 'Zoomies', line: 'Goofy, loyal, and a total couch hog after his evening walk.', bg: '#FFE066' },
        { name: 'Mishti', meta: 'Female · 1 yr · Indie · Medium', loc: 'Malad', energy: 'Balanced', line: 'Shy for ten minutes, then your shadow forever.', bg: '#FF8FB8' }
      ]
    };
  }
}
</script>
</body>
</html>
